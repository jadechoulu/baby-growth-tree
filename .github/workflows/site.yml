name: 小芽验证与发布

on:
  push:
    branches:
      - main
      - codex/english/**
      - codex/growth/**
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: xiaoya-site-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    steps:
      - name: 读取唯一源码工程
        uses: actions/checkout@v4
      - name: 使用 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: 使用 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 验证两套应用与统一发布包
        run: |
          node --test tests/*.test.mjs english/tests/model.test.cjs
          python3 tests/english-pages.test.py
      - name: 构建统一白名单站点
        env:
          XIAOYA_API_BASE: ${{ vars.XIAOYA_API_BASE }}
        run: node scripts/build-site.mjs
      - name: 保存统一站点产物
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/site

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 发布 main 的统一站点
        id: deployment
        uses: actions/deploy-pages@v4

# 专属分支 push 直接验证，避免机器人创建 PR 后出现需要人工授权的空检查。
# 内置令牌同步分支不会触发 push，协调器仍需显式 dispatch 并等待结果。
