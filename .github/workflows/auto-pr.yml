name: 分支自动提交与合并

on:
  push:
    branches:
      - main
      - codex/english/**
      - codex/growth/**
  workflow_run:
    workflows: [小芽验证与发布]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: xiaoya-pr-${{ github.event.workflow_run.head_branch || github.ref_name }}
  cancel-in-progress: false

jobs:
  coordinate:
    if: github.event_name == 'push' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      actions: write
    steps:
      - name: 只运行 main 中的协调代码
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - name: 创建 PR、同步基线并安排受保护合并
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('node:fs');
            const file = './.github/scripts/auto-pr.cjs';
            if (!fs.existsSync(file)) {
              core.notice('首次安装：等待配置 PR 合并进入 main，随后自动启用。');
              return;
            }
            await require(file)({ github, context, core });
