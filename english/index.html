/* 阶段对照：每个源阶段对应多条路线、多个阶段。 */
.roadmap-mode{display:inline-flex;gap:4px;padding:0;border:0;max-width:100%}
.roadmap-mode button{padding:9px 16px;border-radius:6px;font-size:13px;white-space:nowrap;color:#6f8072}
.roadmap-mode .segmented button{padding:9px 16px;font-size:13px}
.roadmap-mode button.active{background:#fff;color:var(--green);font-weight:600;box-shadow:0 2px 5px #23412d09}
.comparison-controls{display:flex;align-items:center;flex-wrap:wrap;gap:12px;margin:0 0 16px}
.comparison-controls label{display:flex;align-items:center;flex-wrap:wrap;gap:9px;font-size:13px;color:#667e6d}
.comparison-controls select{font-size:13px;min-height:40px;max-width:100%}
.comparison-controls .spacer{flex:1}
.comparison-legend{display:flex;align-items:center;flex-wrap:wrap;gap:10px 20px;margin:12px 0 18px;font-size:12px;color:#6e8074;line-height:1.8}
.comparison-legend span{display:inline-flex;align-items:center;gap:7px}
.comparison-legend i{display:inline-block;width:9px;height:9px;border-radius:3px;flex-shrink:0}
.comparison-legend i.direct{background:#6d9c7f}
.comparison-legend i.uncertain{background:#c69d57}
.comparison-legend i.different{background:#abb2a9}
.stage-comparison{min-width:0;display:grid;gap:14px}
.comparison-head,.stage-comparison-row{display:grid;grid-template-columns:200px minmax(0,1fr) minmax(0,1fr);gap:16px;align-items:start}
.comparison-head{padding:0 15px;align-items:stretch}
.comparison-head>div,.comparison-head>span,.comparison-head>strong{min-width:0;padding:12px 13px;border-top:3px solid var(--route,var(--green));border-radius:7px 7px 0 0;background:#edf2e9;font-size:14px;font-weight:600}
.comparison-head small{display:block;margin-top:3px;font-size:11px;font-weight:400;color:var(--muted)}
.stage-comparison-row{position:relative;padding:15px;border:1px solid #e0e7da;border-radius:13px;background:#f0f4ec;scroll-margin-top:22px}
.comparison-origin{min-width:0;border:1px solid #d2dfcc;border-top:4px solid var(--route,var(--green));border-radius:9px;padding:16px 15px;background:#fff;box-shadow:0 4px 14px #243b3504}
.comparison-origin>strong{display:block;margin-bottom:8px;font-size:12px;font-weight:600;color:var(--route,var(--green))}
.comparison-origin h3{font-size:17px;line-height:1.6;overflow-wrap:anywhere}
.comparison-origin p{margin-top:9px;font-size:12px;line-height:1.8;color:#6f8174;overflow-wrap:anywhere}
.comparison-origin .chips{margin-top:11px}
.comparison-jump{display:inline-flex;align-items:center;justify-content:center;gap:5px;max-width:100%;margin-top:15px;padding:8px 11px;border:1px solid #d5e2cf;border-radius:6px;background:#f2f6ee;color:var(--green);font-size:12px;line-height:1.5;text-align:left}
.comparison-jump .icon{width:14px;height:14px}
.comparison-target{min-width:0;display:grid;gap:11px;align-content:start}
.comparison-route{display:none}
.match-card{min-width:0;overflow:hidden;border:1px solid #bed5c5;border-left:4px solid #6d9c7f;border-radius:9px;background:#f7fbf6}
.match-head{display:flex;align-items:flex-start;justify-content:space-between;flex-wrap:wrap;gap:9px;width:100%;padding:12px 13px;text-align:left;font-size:14px;font-weight:600;line-height:1.65;color:#365f48}
.match-head>span:first-child{min-width:0;overflow-wrap:anywhere}
.match-head>.text-link{flex:1 1 80px;min-width:0;padding:0;align-items:flex-start;font-size:14px;font-weight:600;line-height:1.65;overflow-wrap:anywhere}
.match-head strong{font-size:14px;font-weight:600}
.match-head .icon{width:15px;height:15px;margin-top:4px}
.match-head:hover{background:#eaf3e7}
.match-count{display:inline-flex;align-items:center;flex-shrink:0;padding:2px 7px;border:1px solid #d8e7d4;border-radius:5px;background:#e9f1e4;color:#5f815d;font-size:10px;font-weight:500;line-height:1.7;white-space:nowrap}
.match-evidence{display:grid;gap:6px;padding:0 11px 12px}
.match-evidence>button{display:block;width:100%;min-width:0;padding:9px 10px;border:1px solid #e1ebdc;border-radius:6px;background:#fff;text-align:left;line-height:1.7;overflow-wrap:anywhere}
.match-evidence>button:hover{border-color:#a3bba0;background:#fcfefb}
.match-evidence strong{display:block;font-size:13px;font-weight:600;color:#3f5c46}
.match-evidence span{display:block;margin-top:3px;font-size:12px;color:#5a755e;line-height:1.8}
.match-evidence small{display:block;margin-top:3px;font-size:11px;color:#85917f;line-height:1.7}
.match-more{margin:0 11px 11px;padding-top:8px;border-top:1px solid #e0eadb}
.match-more summary,.comparison-secondary>summary{cursor:pointer;color:#698563;font-size:12px;line-height:1.8;padding:3px 0}
.match-more summary:hover,.comparison-secondary>summary:hover{color:var(--green)}

.version-tag{font-size:9px!important;line-height:1.6!important;color:#8e78a0!important;white-space:normal!important}.original-plan-note{background:#f5f0e5;border:1px solid #e8dec8;border-radius:7px;padding:12px;font-size:11px;color:#9b8963;line-height:1.9}.original-activity{background:#fff;border:1px solid var(--line);border-radius:9px;padding:14px;margin:10px 0}.original-activity h4{font-size:13px;line-height:1.8}.original-activity h4>span{color:#a68bbd;font-size:10px;margin-right:8px}.activity-meta{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}.activity-meta span{font-size:10px;background:#f1edf6;color:#9176a7;padding:3px 7px;border-radius:4px}.original-activity p{font-size:12px;line-height:1.9;color:#819176}.series-usage-table .version-tag{display:block;margin-bottom:5px}.series-usage-table tbody tr td:last-child .text-link{display:flex;margin:4px 0}.usage-route{min-width:0}

se8\n常规三阶段:\n 时 间 投 入 建 议 :60-80H| 准 入 标 准 :phase8| 晋 级 标 准 : 时 间 满 足 且 小 小 优 趣 稳 定 新 版\nphase12\n常规四阶段:\n 时间投入建议:60H|准入标准:phase12|晋级标准:时间满足且小小优趣稳定新版 phase14\n常规五阶段:\n 时间投入建议:60H|准入标准:phase14|晋级标准:时间满足且小小优趣稳定新版 phase16\n常规六阶段:\n 时间投入建议:60H|准入标准:phase16\n 晋级标准:佩奇可初步裸听且从常规 1 累计投入时间不低于 400H，最好小小优趣测试稳\n定 phase18，到不了也没事，但不应低于 phase16\n准桥梁阶段:\n 时间投入建议:80-100H|准入标准:佩奇可初步裸听且常规 1-6 累计投入时间不低于\n400H\n 晋级标准:佩奇可裸听且从常规 1 累计总投入时间不低于 480H，小小优趣可不测(因为\n多多益善\n1"},{"page":2,"preview":"assets/previews/qing-02.jpg","text":"有科普词汇)。\n其中，时间投入是最核心的标准，甚至可以当作唯一的晋级标准。当时间投入不够时，孩子\n的听力水平大概率是到不了对应水平的。若时间投入不够，哪怕测试结果达标，晋级也需谨\n慎，因为时间投入是实打实的，但测试结果可能存在误差。如果时间投入到位，且测试结果\n也达标，则可放心晋级。\n04 常规路径核心方法介绍\n方法一:亲子共读\n 标准操作:孩子专注的看图和听，家长读英文 (也可用点读笔点英文)\n注意点\n1.不能让孩子跟读，不要给孩子指读，不能让孩子复述，也不要问孩子问题。\n2.如果孩子已经认字，一定要把文字遮住，不然孩子看字时，是无法同时理解声音的。\n3.亲子共读时，尽量选放松场景，并时刻关注孩子的状态，「无压+高兴趣+高专注度」对内\n化至关重要!\n4.若家长非常担心孩子不懂或纯英文共读时，孩子专注度不够，可考虑用汪培珽亲子共读法\n(搜:亲子共读法)，然后逐步撤掉。但每阶段时间投入需按 80H 来算。\n5.不同于常规路线 1.0 版，2.0 版不再要求某一个素材一定重复 3 遍，而是只要孩子喜欢，\n就可多重复，不设上限，若孩子重复腻了，则可横向同级别其他素材。\n方法二:看动画\n 标准操作:\n选择和孩子难度贴近的动画，每天 20-30 分钟!常规 4 之前，动画可只看不听或少量听，如\n果孩子接受重复看，可多看多听，不用限制孩子喜欢素材的重复遍数!\n注意点 1:\n如果孩子已对文字敏感，看动画时一定要选无字幕版本，如果找不到无字幕版本，一定要物\n理遮挡字幕。\n注意点 2:\n在孩子看动画时，尽量不要打断孩子，也不要逐句翻译，更不要询问或考察孩子是否懂(比\n如让孩子复述)。只要选择的动画难度和孩子水平符合，内化就不会有问题。若孩子听音频\n时表示听不太懂，可考虑过一下动画台词本，有静态画面支撑，再去联想动态画面，会更轻\n松一些。\n小小优趣成长计划:有不少家长办理了小小优趣 Svip 的会员，里面有一个成长计划，可\n以看动画，然后玩一玩里面自带的游戏，可用来加强和巩固!\n目前在 phase13 及之前的成长计划(小猪佩奇之前)，推荐的动画都还比较合理，phase13\n以后的成长计划不少动画难度突然拔高太多。所以如果家长想跟成长计划的话，phase13 及\n以前的可以参考下文素材篇中推荐的级别去对应使用。\n注意:若孩子已对文字敏感，看动画时一定要选无字幕版本，如果找不到无字幕版本，一定\n要物理遮挡字幕。\n方法三:听音频\n 标准操作:\n读过的分级，看过的动画，如果孩子不排斥，都可让孩子听一听(动画音频的切入成功率会\n多多益善\n2"},{"page":3,"preview":"assets/previews/qing-03.jpg","text":"更高一些)!\n注意点 1:\n听音频需要脱离画面，仅靠声音去回忆画面，在牛 4 以前，孩子的语法结构尚未打通，所以\n难度是存在的，甚至有些孩子会排斥听，可慢慢引导，不要操之过急。\n注意点 2:\n大部分孩子做不到坐那完全专注听音频，一般只需确保听音频环境相对安静，然后没有频繁\n合并其他动脑事件，就可算有效听力输入时间。不过孩子水平越低，听音频内化效果越差，\n不同阶段，有效时间要打折。\n时间计算:亲子共读*1+动画*1+音频*(0.5 或 0.8)\n亲子共读和看动画(或用融合 app)时间可按 1:1 计算，听音频时间需在有效时间基础上进一\n步打折，牛 1-2 阶段，可听音频但不计入;牛 3 阶段，X0.5;牛 4 阶段及以后，X0.8。当素材\n难度级别超出孩子水平 2 个级别+，直接无效，不计入!\n05 常规 1:积累 200-300 词素材(60-80H|目标:phase5)\n主线绘本:\n 古力小超人 1|古力小超人 2|巴塔木口语书(24 本)\n|QPlay 奇问妙想国\n主线分级:\n 培生启明星 1|培生词汇妙趣屋 1-2|Super hammy A-B Buddy Reader A-B 主线动画:\n·Wow English (S1-3)| Muzzy(1-6 集)\n辅线分级:\n 大猫 1(虚构部分)|RAZAA-A(虚构部分)\n辅线动画:\n Wow 学练机(喜欢 Wow 动画优选)|动物国王大冒险清华幼儿英语启蒙动画\n趣味拓展:\n 小书虫 1\n融合 App(可替代动画):\n 小小优趣成长计划 Phase1-4\n05 常规 1: 积累 200-300 词要点\n 动画都可尝试一下，都是零基础，无门槛。如果有小小优趣 SVIP，可单独跟 phase1-4\n内的成长计划，建议从 phase1 开始，前 4 个级别的素材搭配合理。\n 分级或绘本，3-4 岁，建议可先试试从古力小超人 1 切入，目前从大家的反馈来看，5\n岁以前的娃，对古力的接受度很高。如果古力 1 可以切入，古力 2+Qplay 也可以切入，\n另外同样是英雄题材的 Super Hammy 也可成功切入，略含几本英雄题材的 Buddy\nReady 大概率也能切入。培生启明星 1 是经典分级，趣味性也不错，推荐加入。其他任\n选。\n 分级或绘本若觉得古力幼稚，可直接从培生词汇妙趣屋切入，可选前 2 个级别，句型重\n复度很高，且为虚构类故事，孩子接受度高。培生启明星 1 是经典分级，趣味性不错，\n推荐加入。其他可任选。\n多多益善\n3"},{"page":4,"preview":"assets/previews/qing-04.jpg","text":"06 常规 2: 积累 300-500 词素材(60-80H|目标: phase8)\n主线绘本:\n WPlay 词汇妙趣国\n主线分级:\n 牛 1-2|培生启明星 2|培生词汇妙趣屋 3|Super hammy C-D | Buddy Reader C-D\n主线动画:\n Wow English (S4-5)| Muzzy(7-12 集)\n辅线分级:\n 大猫 2(虚构部分)|RAZB(虚构部分\n辅线动画:\n Wow 学练机(喜欢 Wow 选)|动物国王大冒险|趣趣知知鸟|Muzzy 橙盒(喜欢 Muzzy 动画选\n趣味拓展:\n 小书虫 2\n融合 App (可替代动画):\n 小小优趣成长计划 Phase 5-7\n06 常规 2: 积累 300-500 词要点\n 动画主要接续常规 1，如果常规 1 喜欢，常规 2 大概率也没问题。若有小小优趣 SVIP，\n可单独跟 phase5-7 内的成长计划，这 3 个级别的素材搭配和常规 2 阶段是匹配的。\n 如果常规 1，孩子很喜欢古力系列，则可继续考虑 Wplay，古力系列难度最高的一套，\n适合常规 2，和古力其他系列一样，有动画，有绘本，有音频，另外还附送了三本可点\n读的主题词典。\n 从常规 2 开始，可以加入分级趣味王牛津树了，牛 1-2 的难度符合当前区间，另外和\n牛津树搭配的最佳选择依旧是培生，培生的主线为启明星。如果常规 1 有加入培生词汇\n妙趣屋 1-2，常规 2 可以加入培生词汇妙趣屋 3。其他素材，可根据需要自由搭配。\n07 常规 3:积累 500-800 词素材(60-80H|目标:phase12)\n主线绘本:\n●饼干狗|小猪小象(简单部分)\n主线分级:\n 牛 3|培生启明星 3|Super hammy E-F| Buddy Reader E-F|大猫 3(虚构部分)\n主线动画:\n●Little Fox L1 绿森林|The Blobs|3S 动画儿歌(小小优趣版 L1-3)\n辅线分级:\n●RAZ C-D (虚构部分)|口语剧场(Part1)\n辅线动画(原版-语速略快):\n●蓝色小考拉小鼠波波小羊提米\n趣味拓展:\n 小书虫 3|培生儿童 L3|培生 400 句上|Best Buddies(学乐橡子系列)\n融合 App(可替代动画):\n 小小优趣成长计划 Phase8-9(非测试级别)\n多多益善\n4"},{"page":5,"preview":"assets/previews/qing-05.jpg","text":"07 常规 3:积累 500-800 词要点\n 1.0 版本推荐的两部动画「小鼠波波」和「蓝色小考拉」，不少家长反馈比较“难”。2.0\n版本，庆爸将这两部动画调整到了辅线，大家可选择性观看。\n Little Fox L1 级别里有两部动画比较简单，一部是绿森林，一部是 The Blobs，庆爸将这\n两部加入常规 3，作为主线动画。另外为了防止有些娃不喜欢这两部动画，庆爸还纳入\n了 SSS 动画儿歌(小小优趣版本里的 L1-3 级别)，可能有些孩子在常规 1 和 2 已经看过\n和听过 3S，但是儿歌想要内化得比较好，其实得有常规 3-4 的水平，所以可再次利用\n3S 儿歌。\n 常规 3，效率最高的方法依旧是亲子共读，其次是看动画，音频可以引导孩子听了。但\n孩子可能不一定愿意听，愿意听的孩子也很可能听不太懂，目的主要是培养孩子听音频\n的习惯，因为常规 4 开始，听音频就变得重要了。\n08 常规 4:积累 800-1000 词素材(60H|目标:phase14)\n主线绘本:\n 小猪小象(难的部分)|波西与皮普|佩奇高频词绘本(L1-3) |小猪和狐狸(4 册点读)\n主线分级:\n 牛 4 培生启明星 4 大猫 4(虚构)\n主线动画:\n●Little Fox L1 选 2-3 部(Bat| DinoTire)\n辅线分级:\n 快乐瓢虫 L1|RAZE-F(虚构)|I can read 预备级\n(挑选)|口语剧场(Part2)\n辅线动画:\n 道奇(难度不低-尽量优先 Little Fox)\n趣味拓展:\n 小书虫 4(虚构) |培生儿童 L4|培生 400 句下|银盒号阅读全解码 L1-3|学乐橡子点读系列\n(你好，小螃蟹|你好，小刺猬|独角兽与雪人)\n融合 App(可替代动画):\n 小小优趣成长计划 Phase10-11(非测试级别)\n09 常规 5:积累 1000-1200 词素材(60H|目标:phase16)\n主线绘本:\n 皮特猫 (My First) |小毛人 (My First) |佩奇高频词绘本(L4-5)\n主线分级:\n 牛 5 |培生启明星 5|大猫 5(虚构)\n主线动画:\n Little Fox L2 任选 2 部(Bird|彼得兔|马克笔)\n辅线分级:\n 快乐瓢虫 L2|RAZ G-H(虚构)|I can read 基础级(挑选)\n辅线动画:\n 小猪佩奇 S1-2(建议 phase15 再加)\n多多益善\n5"},{"page":6,"preview":"assets/previews/qing-06.jpg","text":"趣味拓展:\n 小书虫 5(虚构)|培生儿童 L5|银盒号阅读全解码 L4-5|丽声冒险岛 1-3(背面 L3-5)|淘气兔\n子(点读版)|脏脏书(科普)\n融合 App(可替代动画):\n 小小优趣成长计划 Phase12(非测试级别)\n10 常规 6:积累 1200-1500 词素材(60H|目标;phase18)\n主线绘本:\n 汪培珽一段 Syd Hoff 系列|佩奇(红黄蓝)盒\n主线分级:\n 牛 6 培生启明星 6 大猫 6(虚构)\n主线动画:\n 小猪佩奇 S1-3(可接着常规 5 往后)\n辅线分级:\n 快乐瓢虫 L3|RAZI-J (虚构)|I can read 基础\n辅线动画:\n Little Fox L3 经典故事\n趣味拓展:\n 小书虫 6(虚构)培生儿童 L6|银河号阅读全解码 L6 丽声冒险岛 4(背面 L6)\n科普拓展:\n 水先生| Baby why(生物化学)|Baby all(物理\n|艺术)|心智麦田轻科普绘本(11 本)\n融合 App(可替代动画):\n 小小优趣成长计划 Phase13(非测试级别)\n11 准桥梁阶段:积累 1500-2000 词素材(80-100H)\n主线绘本准桥梁:\n 大红狗|胖龙蓝蓝|青蛙蟾蜍|Frog and Friends|女巫温妮(绘本版)|心智麦田(庆爸精选 35 本)\n主线分级:\n 牛 7-9|培生启明星 7-8|快乐瓢虫 L4\n主线动画:\n 小猪佩奇 S4-5(裸听)\n辅线分级:\n●大猫 7-9 (虚构)|RAZ K-M(虚构)\n辅线动画:\n●Little Fox L3(魔法师和猫|柳林风声)|卡由|本霍丽天才宝贝熊 64 动物街呜米 123\n趣味拓展:\n●小书虫 7-10(虚构)|银河号阅读全解码 L7-9|丽声冒险岛 5-7 (背面 L7-9)|布鲁伊绘本(点读)\n科普拓展:\n 神奇校车红蓝盒(20 册)融合 App(本级别不推荐)\n多多益善\n6"}],"notes":[{"title":"路线核心","text":"把握孩子听力水平，匹配符合水平的素材，在方法用对的前提下将时间投入到位。原文强调3–4岁更适合常规路径，低龄孩子在跨多个难度的大循环中可能卡认知。","pages":[1]},{"title":"晋级以投入时间为核心","text":"原文把投入时间视为最核心、甚至可作为唯一晋级标准；时间不足即使测试达标也应谨慎；时间到位且测试达标则可晋级。网页应同时展示实际投入与理解状态，不用词汇量或年龄直接替代Phase测试。","pages":[1,2]},{"title":"亲子共读方法（原文）","text":"孩子专注看图听英文，家长读或点读笔点读。不要求跟读、指读、复述，也不提问考察；若已认字，原文建议遮文字。选择放松场景，关注无压、高兴趣和专注。如需汪培珽亲子共读法辅助，可逐步撤掉，但每阶段按80小时算。2.0不要求每份素材固定重复3遍，喜欢可多重复，腻了横向换同级素材。","pages":[2]},{"title":"看动画方法（原文3–4岁路线）","text":"选贴近孩子难度的动画，每天20–30分钟。常规4之前可只看不听或少量听，喜欢的内容可重复。对文字敏感时用无字幕版或遮字幕；观看时不打断、不逐句翻译、不考察。听音频不懂可用动画台词本的静态画面辅助。该屏幕安排属于原作者面向3–4岁的方案，不可直接套到未满2岁的孩子。","pages":[2]},{"title":"听音频方法（原文）","text":"读过的分级、看过的动画都可在孩子不排斥时听，动画音频切入成功率可能更高。牛4之前语法结构尚未打通，可能排斥音频，慢慢引导。环境相对安静、不频繁同时进行其他动脑事件，可算有效听力；不是必须全程坐着专注听。","pages":[2,3]},{"title":"成长计划与测试不同","text":"第1页Phase准入/晋级是小小优趣新版测试。素材栏Phase 1–13是成长计划，并非同一标尺；原文认为成长计划Phase13以前推荐较合理，之后不少动画突然过难。","pages":[1,2,3,4,5,6]},{"title":"词汇范围的含义","text":"各阶段200–300、300–500等是原文阶段积累目标，不能理解成阶段入门必需词数；常规1的准入明确为零基础。","pages":[1,3,4,5,6]}],"timeAccounting":{"formula":"有效小时 = 亲子共读小时 × 1 + 动画小时 × 1 + 音频小时 × 对应系数","sharedReadingFactor":1,"animationFactor":1,"appFactor":1,"audioFactors":[{"level":"牛津树1–2阶段","factor":0,"note":"可听音频，但不计入投入时数。"},{"level":"牛津树3阶段","factor":0.5},{"level":"牛津树4阶段及以后","factor":0.8}],"invalidRule":"素材难度超过孩子水平2个级别及以上，原文直接视为无效、不计入。","environment":"环境相对安静，且没有频繁合并其他动脑事件。","cumulativeThresholds":[{"at":"常规6晋级/准桥梁准入","minHours":400,"additional":"佩奇可初步裸听"},{"at":"准桥梁晋级","minHours":480,"additional":"佩奇可裸听"}],"pages":[1,3]},"supplement":{"id":"reading-map","title":"常见英文分级读物难度对照表","author":null,"attribution":"图片未提供可确认作者；水印无法可靠确认，不归属于庆爸。","sourceFile":"assets/sources/supplement.png","preview":"assets/previews/supplement.png","kind":"阅读难度参考","columns":["年级 Grade","Band","Lexile","AR","GRL","RAZ","学乐","海尼曼","牛津树","大猫","培生","红火箭","阅读进阶"],"columnGroups":{"各种分级方法":["Band","Lexile","AR","GRL"],"美国分级读物":["RAZ","学乐"],"英国分级读物":["海尼曼","牛津树","大猫","培生"],"新西兰分级读物":["红火箭"]},"rows":[{"grade":"K","band":"Lilac","lexile":"BR70L-10L","ar" async function backup(){
  const payload={version:1,exportedAt:new Date().toISOString(),profile:S.profile,favorites:S.favorites,records:S.records};
  const content=JSON.stringify(payload,null,2),filename='小芽英语-启蒙记录备份.json';
  if(['127.0.0.1','localhost'].includes(location.hostname)&&location.protocol==='http:'){
    try{
      const response=await fetch('/__local-backup',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({filename,content})});
      if(!response.ok)throw new Error('备份未能保存到育儿目录，请确认本地记录服务正在运行后重试。');
      const result=await response.json();if(!result.saved||!result.path)throw new Error('备份未收到保存确认，请重试。');
      toast('备份已保存：'+result.path);
    }catch(error){toast(error.message);}
    return;
  }
  const url=URL.createObjectURL(new Blob([content],{type:'application/json'}));const a=h('a',{href:url,download:filename});a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);toast('已导出宝宝档案、收藏和素材小记录');
}
